<svg xmlns="http://www.w3.org/2000/svg" width="980" height="345" viewBox="0 0 980 345" role="img" aria-labelledby="title desc">
  <title id="title">Secure AWS engineering for live applications</title>
  <desc id="desc">Matt builds production tools on AWS with security, reliability, and operational visibility treated as core engineering requirements.</desc>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF7ED"/>
      <stop offset=".45" stop-color="#FFFBEB"/>
      <stop offset="1" stop-color="#EFF6FF"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#EA580C"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0F172A" flood-opacity=".07"/>
    </filter>
  </defs>

  <rect width="980" height="345" rx="22" fill="#FFFFFF"/>
  <rect x="1" y="1" width="978" height="343" rx="21" fill="none" stroke="#E2E8F0"/>
  <path d="M1 22A21 21 0 0 1 22 1h936a21 21 0 0 1 21 21v125H1Z" fill="url(#wash)"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <path d="M68 33l25 9v21c0 20-11 34-25 41-14-7-25-21-25-41V42Z" fill="url(#shield)"/>
    <path d="M57 64l8 8 15-18" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="116" y="49" font-size="12" font-weight="700" letter-spacing="2" fill="#B45309">AWS · SECURITY · PRODUCTION</text>
    <text x="116" y="82" font-size="27" font-weight="700" fill="#0F172A">I build apps for the cloud, ready for limitless users.</text>
    <text x="116" y="108" font-size="14" fill="#475569">I design systems that scale together—securely, reliably, and without compromising the experience as demand grows.</text>
  </g>

  <g filter="url(#shadow)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <rect x="34" y="158" width="288" height="146" rx="16" fill="#FFFFFF" stroke="#FED7AA"/>
    <circle cx="70" cy="194" r="18" fill="#FFEDD5"/>
    <path d="M63 196h14v10H63Zm3-1v-5a4 4 0 0 1 8 0v5" fill="none" stroke="#EA580C" stroke-width="2.2" stroke-linejoin="round"/>
    <text x="98" y="190" font-size="11" font-weight="700" letter-spacing="1.2" fill="#EA580C">SECURE BY DESIGN</text>
    <text x="98" y="212" font-size="17" font-weight="700" fill="#0F172A">Protect every layer</text>
    <text x="58" y="243" font-size="13" fill="#475569">
      <tspan x="58">Least-privilege access, managed secrets,</tspan>
      <tspan x="58" dy="20">encryption, and defense-in-depth guide</tspan>
      <tspan x="58" dy="20">how I develop live applications.</tspan>
    </text>

    <rect x="346" y="158" width="288" height="146" rx="16" fill="#FFFFFF" stroke="#DBEAFE"/>
    <circle cx="382" cy="194" r="18" fill="#DBEAFE"/>
    <path d="M373 198c0-5 4-9 9-9 4 0 7 2 8 6 4 0 7 3 7 7h-24c-3 0-5-2-5-5 0-2 2-4 5-4" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round"/>
    <text x="410" y="190" font-size="11" font-weight="700" letter-spacing="1.2" fill="#2563EB">AWS FOUNDATION</text>
    <text x="410" y="212" font-size="17" font-weight="700" fill="#0F172A">Build for production</text>
    <text x="370" y="243" font-size="13" fill="#475569">
      <tspan x="370">Cloud-native services, containers, and</tspan>
      <tspan x="370" dy="20">infrastructure as code create scalable,</tspan>
      <tspan x="370" dy="20">repeatable, and resilient systems.</tspan>
    </text>

    <rect x="658" y="158" width="288" height="146" rx="16" fill="#FFFFFF" stroke="#D1FAE5"/>
    <circle cx="694" cy="194" r="18" fill="#D1FAE5"/>
    <path d="M686 199v-7M694 199v-13M702 199v-9" stroke="#059669" stroke-width="2.3" stroke-linecap="round"/>
    <text x="722" y="190" font-size="11" font-weight="700" letter-spacing="1.2" fill="#059669">OPERATIONAL CARE</text>
    <text x="722" y="212" font-size="17" font-weight="700" fill="#0F172A">Operate with confidence</text>
    <text x="682" y="243" font-size="13" fill="#475569">
      <tspan x="682">Logging, monitoring, backups, and clear</tspan>
      <tspan x="682" dy="20">deployment controls help me safeguard</tspan>
      <tspan x="682" dy="20">availability, data, and user trust.</tspan>
    </text>
  </g>

  <text x="490" y="328" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="600" fill="#64748B" text-anchor="middle">AWS · IAM · KMS · Secrets Manager · CloudWatch · Docker · Terraform · CI/CD</text>
</svg>
