<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" role="img" aria-labelledby="title desc">
  <title id="title">Tools I keep close</title>
  <desc id="desc">A curated toolkit for thinking, experimenting, visualizing, modeling, and presenting ideas.</desc>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EFF6FF"/>
      <stop offset=".5" stop-color="#FAF5FF"/>
      <stop offset="1" stop-color="#FFF7ED"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0F172A" flood-opacity=".07"/>
    </filter>
  </defs>

  <rect width="980" height="430" rx="22" fill="#FFFFFF"/>
  <rect x="1" y="1" width="978" height="428" rx="21" fill="none" stroke="#E2E8F0"/>
  <path d="M1 22A21 21 0 0 1 22 1h936a21 21 0 0 1 21 21v91H1Z" fill="url(#wash)"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="middle">
    <text x="490" y="42" font-size="12" font-weight="700" letter-spacing="2" fill="#64748B">A CURATED CREATIVE &amp; TECHNICAL TOOLKIT</text>
    <text x="490" y="77" font-size="27" font-weight="700" fill="#0F172A">Tools I keep close</text>
    <text x="490" y="101" font-size="14" fill="#475569">The right tools help me move quickly from rough thinking to clear, useful outcomes.</text>
  </g>

  <g filter="url(#shadow)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <rect x="34" y="128" width="288" height="118" rx="16" fill="#FFFFFF" stroke="#DBEAFE"/>
    <circle cx="66" cy="162" r="17" fill="#DBEAFE"/>
    <text x="66" y="167" font-size="13" font-weight="700" fill="#2563EB" text-anchor="middle">E</text>
    <text x="94" y="158" font-size="11" font-weight="700" letter-spacing="1.2" fill="#2563EB">THINK VISUALLY</text>
    <text x="94" y="180" font-size="17" font-weight="700" fill="#0F172A">Excalidraw</text>
    <text x="58" y="211" font-size="13" fill="#64748B"><tspan x="58">I like its low-friction canvas for mapping</tspan><tspan x="58" dy="19">systems and making ideas tangible fast.</tspan></text>

    <rect x="346" y="128" width="288" height="118" rx="16" fill="#FFFFFF" stroke="#EDE9FE"/>
    <circle cx="378" cy="162" r="17" fill="#EDE9FE"/>
    <text x="378" y="167" font-size="13" font-weight="700" fill="#7C3AED" text-anchor="middle">F</text>
    <text x="406" y="158" font-size="11" font-weight="700" letter-spacing="1.2" fill="#7C3AED">DESIGN EXPERIENCES</text>
    <text x="406" y="180" font-size="17" font-weight="700" fill="#0F172A">Figma</text>
    <text x="370" y="211" font-size="13" fill="#64748B"><tspan x="370">I use it to move fluidly from interface</tspan><tspan x="370" dy="19">concepts to collaborative prototypes.</tspan></text>

    <rect x="658" y="128" width="288" height="118" rx="16" fill="#FFFFFF" stroke="#FFE4E6"/>
    <circle cx="690" cy="162" r="17" fill="#FFE4E6"/>
    <text x="690" y="167" font-size="13" font-weight="700" fill="#E11D48" text-anchor="middle">M</text>
    <text x="718" y="158" font-size="11" font-weight="700" letter-spacing="1.2" fill="#E11D48">TRACK EXPERIMENTS</text>
    <text x="718" y="180" font-size="17" font-weight="700" fill="#0F172A">MLflow</text>
    <text x="682" y="211" font-size="13" fill="#64748B"><tspan x="682">I value the clarity it brings to comparing</tspan><tspan x="682" dy="19">models, metrics, and learning over time.</tspan></text>

    <rect x="34" y="266" width="288" height="118" rx="16" fill="#FFFFFF" stroke="#D1FAE5"/>
    <circle cx="66" cy="300" r="17" fill="#D1FAE5"/>
    <text x="66" y="305" font-size="13" font-weight="700" fill="#059669" text-anchor="middle">3</text>
    <text x="94" y="296" font-size="11" font-weight="700" letter-spacing="1.2" fill="#059669">BUILD IN 3D</text>
    <text x="94" y="318" font-size="17" font-weight="700" fill="#0F172A">Three.js</text>
    <text x="58" y="349" font-size="13" fill="#64748B"><tspan x="58">I enjoy turning data and interactions into</tspan><tspan x="58" dy="19">immersive, memorable web experiences.</tspan></text>

    <rect x="346" y="266" width="288" height="118" rx="16" fill="#FFFFFF" stroke="#CFFAFE"/>
    <circle cx="378" cy="300" r="17" fill="#CFFAFE"/>
    <text x="378" y="305" font-size="12" font-weight="700" fill="#0891B2" text-anchor="middle">DB</text>
    <text x="406" y="296" font-size="11" font-weight="700" letter-spacing="1.2" fill="#0891B2">MODEL SYSTEMS</text>
    <text x="406" y="318" font-size="17" font-weight="700" fill="#0F172A">dbdiagram</text>
    <text x="370" y="349" font-size="13" fill="#64748B"><tspan x="370">I like how quickly it makes database</tspan><tspan x="370" dy="19">structure visible and easy to discuss.</tspan></text>

    <rect x="658" y="266" width="288" height="118" rx="16" fill="#FFFFFF" stroke="#FFEDD5"/>
    <circle cx="690" cy="300" r="17" fill="#FFEDD5"/>
    <text x="690" y="305" font-size="12" font-weight="700" fill="#EA580C" text-anchor="middle">MM</text>
    <text x="718" y="296" font-size="11" font-weight="700" letter-spacing="1.2" fill="#EA580C">PRESENT IDEAS</text>
    <text x="718" y="318" font-size="17" font-weight="700" fill="#0F172A">Mediamodifier</text>
    <text x="682" y="349" font-size="13" fill="#64748B"><tspan x="682">I use polished mockups to communicate</tspan><tspan x="682" dy="19">the product vision clearly and quickly.</tspan></text>
  </g>
</svg>
