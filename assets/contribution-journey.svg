<svg xmlns="http://www.w3.org/2000/svg" width="980" height="440" viewBox="0 0 980 440" role="img" aria-labelledby="title desc">
  <title id="title">Matt Snyder's GitHub contribution journey from 2019 through August 2026</title>
  <desc id="desc">A bar chart of annual GitHub contributions. The highest year was 2021 with 1,471 contributions. 2026 has 1,277 contributions year to date.</desc>
  <defs>
    <linearGradient id="blue" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#F43F5E"/>
      <stop offset="1" stop-color="#FB7185"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0F172A" flood-opacity=".08"/>
    </filter>
  </defs>

  <rect width="980" height="440" rx="22" fill="#FFFFFF"/>
  <rect x="1" y="1" width="978" height="438" rx="21" fill="none" stroke="#E2E8F0"/>

  <text x="40" y="50" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="24" font-weight="700" fill="#0F172A">Contribution journey</text>
  <text x="40" y="76" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" fill="#64748B">YEARLY GITHUB ACTIVITY · STATIC SNAPSHOT</text>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <rect x="695" y="29" width="245" height="78" rx="14" fill="#EFF6FF"/>
    <text x="715" y="54" font-size="12" font-weight="600" fill="#2563EB">TOTAL CONTRIBUTIONS</text>
    <text x="715" y="88" font-size="30" font-weight="700" fill="#0F172A">3,407</text>
    <text x="809" y="87" font-size="13" fill="#64748B">since 2019</text>
  </g>

  <!-- chart grid -->
  <g stroke="#E2E8F0" stroke-width="1">
    <line x1="54" y1="332" x2="656" y2="332"/>
    <line x1="54" y1="254" x2="656" y2="254"/>
    <line x1="54" y1="176" x2="656" y2="176"/>
    <line x1="54" y1="98" x2="656" y2="98"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" fill="#94A3B8" text-anchor="end">
    <text x="46" y="336">0</text>
    <text x="46" y="258">500</text>
    <text x="46" y="180">1K</text>
    <text x="46" y="102">1.5K</text>
  </g>

  <!-- annual contribution bars; scale max 1,500 -->
  <g filter="url(#shadow)">
    <rect x="74"  y="326" width="48" height="6"   rx="6" fill="url(#blue)"/>
    <rect x="148" y="302" width="48" height="30"  rx="8" fill="url(#blue)"/>
    <rect x="222" y="103" width="48" height="229" rx="8" fill="url(#blue)"/>
    <rect x="296" y="326" width="48" height="6"   rx="6" fill="url(#blue)"/>
    <rect x="370" y="326" width="48" height="6"   rx="6" fill="url(#blue)"/>
    <rect x="444" y="308" width="48" height="24"  rx="8" fill="url(#blue)"/>
    <rect x="518" y="290" width="48" height="42"  rx="8" fill="url(#blue)"/>
    <rect x="592" y="133" width="48" height="199" rx="8" fill="url(#coral)"/>
  </g>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">
    <text x="98"  y="316">4</text>
    <text x="172" y="292">194</text>
    <text x="246" y="93">1,471</text>
    <text x="320" y="316">16</text>
    <text x="394" y="316">19</text>
    <text x="468" y="298">156</text>
    <text x="542" y="280">270</text>
    <text x="616" y="123" fill="#E11D48">1,277</text>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" fill="#64748B" text-anchor="middle">
    <text x="98"  y="356">2019</text>
    <text x="172" y="356">2020</text>
    <text x="246" y="356">2021</text>
    <text x="320" y="356">2022</text>
    <text x="394" y="356">2023</text>
    <text x="468" y="356">2024</text>
    <text x="542" y="356">2025</text>
    <text x="616" y="356" font-weight="700" fill="#E11D48">2026 YTD</text>
  </g>

  <!-- insight column -->
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <line x1="680" y1="131" x2="680" y2="373" stroke="#E2E8F0"/>

    <circle cx="716" cy="164" r="7" fill="#FBBF24"/>
    <text x="736" y="160" font-size="12" font-weight="600" fill="#64748B">PEAK YEAR</text>
    <text x="736" y="184" font-size="21" font-weight="700" fill="#0F172A">2021 · 1,471</text>

    <circle cx="716" cy="235" r="7" fill="#FB7185"/>
    <text x="736" y="231" font-size="12" font-weight="600" fill="#64748B">2026 MOMENTUM</text>
    <text x="736" y="255" font-size="21" font-weight="700" fill="#0F172A">87% of peak</text>

    <circle cx="716" cy="306" r="7" fill="#60A5FA"/>
    <text x="736" y="302" font-size="12" font-weight="600" fill="#64748B">PUBLIC COMMITS</text>
    <text x="736" y="326" font-size="21" font-weight="700" fill="#0F172A">155 since 2019</text>

    <rect x="702" y="351" width="220" height="32" rx="16" fill="#F8FAFC"/>
    <circle cx="720" cy="367" r="5" fill="#F43F5E"/>
    <text x="733" y="371" font-size="12" fill="#475569">Last updated Aug 12, 2026</text>
  </g>

  <text x="40" y="410" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" fill="#94A3B8">Source: GitHub contribution calendar · Snapshot captured August 12, 2026 · 2026 is year to date</text>
</svg>
