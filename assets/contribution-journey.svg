<svg xmlns="http://www.w3.org/2000/svg" width="980" height="490" viewBox="0 0 980 490" role="img" aria-labelledby="title desc">
  <title id="title">GitHub contributions before and after adopting AI</title>
  <desc id="desc">A two-era comparison showing 2,330 contributions from 2019 through 2025 and 1,277 contributions in 2026 year to date, plus languages used in each era.</desc>
  <defs>
    <linearGradient id="pre" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="post" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#F43F5E"/>
    </linearGradient>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EFF6FF"/>
      <stop offset=".55" stop-color="#FAF5FF"/>
      <stop offset="1" stop-color="#FFF1F2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0F172A" flood-opacity=".10"/>
    </filter>
  </defs>

  <rect width="980" height="490" rx="22" fill="#FFFFFF"/>
  <rect x="1" y="1" width="978" height="488" rx="21" fill="none" stroke="#E2E8F0"/>
  <path d="M1 22A21 21 0 0 1 22 1h936a21 21 0 0 1 21 21v92H1Z" fill="url(#wash)"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="40" y="45" font-size="12" font-weight="700" letter-spacing="2" fill="#64748B">CONTRIBUTION JOURNEY · STATIC SNAPSHOT</text>
    <text x="40" y="80" font-size="27" font-weight="700" fill="#0F172A">Before AI → After AI</text>
    <text x="40" y="103" font-size="14" fill="#475569">How an AI-augmented workflow changed the pace of building.</text>

    <rect x="756" y="25" width="184" height="68" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="776" y="50" font-size="11" font-weight="700" letter-spacing="1" fill="#64748B">TOTAL CONTRIBUTIONS</text>
    <text x="776" y="78" font-size="25" font-weight="700" fill="#0F172A">3,607</text>
  </g>

  <!-- two-era contribution comparison; circle area reflects contribution volume -->
  <g filter="url(#shadow)">
    <circle cx="255" cy="224" r="88" fill="url(#pre)"/>
    <circle cx="696" cy="224" r="65" fill="url(#post)"/>
  </g>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="middle">
    <text x="255" y="122" font-size="13" font-weight="700" letter-spacing="1.8" fill="#2563EB">PRE-AI</text>
    <text x="255" y="203" font-size="13" font-weight="700" letter-spacing="1.2" fill="#DBEAFE">2019–2025</text>
    <text x="255" y="241" font-size="34" font-weight="700" fill="#FFFFFF">2,330</text>
    <text x="255" y="263" font-size="13" fill="#EFF6FF">contributions</text>

    <text x="696" y="142" font-size="13" font-weight="700" letter-spacing="1.8" fill="#E11D48">POST-AI</text>
    <text x="696" y="208" font-size="13" font-weight="700" letter-spacing="1.2" fill="#FCE7F3">2026 YTD</text>
    <text x="696" y="241" font-size="30" font-weight="700" fill="#FFFFFF">1,277</text>
    <text x="696" y="260" font-size="13" fill="#FDF2F8">contributions</text>
    <text x="255" y="326" font-size="13" font-weight="700" fill="#334155">35 repositories</text>
    <text x="696" y="309" font-size="13" font-weight="700" fill="#334155">5 active repositories</text>

    <line x1="370" y1="224" x2="573" y2="224" stroke="#CBD5E1" stroke-width="2"/>
    <path d="M565 216l10 8-10 8" fill="none" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="411" y="189" width="123" height="27" rx="13.5" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="472" y="207" font-size="11" font-weight="700" fill="#475569">AI-AUGMENTED</text>
    <text x="472" y="251" font-size="13" font-weight="700" fill="#7C3AED">55% of 7 years</text>
    <text x="472" y="269" font-size="11" fill="#64748B">in one partial year</text>
  </g>

  <!-- language lists -->
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="490" y="353" font-size="12" font-weight="700" letter-spacing="2" fill="#64748B" text-anchor="middle">MOST USED LANGUAGES &amp; TOOLS</text>
    <rect x="42" y="368" width="426" height="82" rx="14" fill="#EFF6FF"/>
    <text x="62" y="391" font-size="11" font-weight="700" letter-spacing="1.2" fill="#2563EB">PRE-AI · 2019–2025</text>
    <text x="62" y="415" font-size="13" font-weight="600" fill="#334155">1 Java · 2 Python · 3 JavaScript · 4 HTML · 5 TypeScript</text>
    <text x="62" y="437" font-size="12" fill="#475569">Git · Docker · AWS · React · MySQL</text>

    <rect x="512" y="368" width="426" height="82" rx="14" fill="#FAF5FF"/>
    <text x="532" y="391" font-size="11" font-weight="700" letter-spacing="1.2" fill="#7C3AED">POST-AI · 2026 YTD</text>
    <text x="532" y="415" font-size="13" font-weight="600" fill="#334155">1 TypeScript · 2 Python · 3 Shell · 4 CSS · 5 SQL</text>
    <text x="532" y="437" font-size="12" fill="#475569">AI Agents · React · Next.js · Cloudflare · Docker</text>
  </g>

  <text x="490" y="474" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">Snapshot: Aug 12, 2026 · Includes ongoing Snydex platforms in both eras · 2026 is year to date</text>
</svg>
